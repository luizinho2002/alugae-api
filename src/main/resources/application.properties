# 1. Configuração da conexão com o PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/alugae
spring.datasource.username=postgres
spring.datasource.password=123456

# 2. Configurações do JPA / Hibernate
# O 'update' faz o Spring criar ou atualizar a tabela 'imoveis' automaticamente no banco
spring.jpa.hibernate.ddl-auto=update

# Mostra no terminal os comandos SQL gerados pelo Hibernate (ótimo para estudos)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true